<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Flashcards</title>
<style>
:root{
--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--bg:#f3f4f6;--surface:#fff;--ink:#1c1f24;--mut:#5f6670;--line:#e1e4e9;
--ac:#2f5fd0;--on-ac:#fff;--acsoft:#e8eefc;
--good:#1c7a47;--goodbg:#e3f3ea;--bad:#c0392b;--badbg:#fbe8e5;
--warnbg:#fdf3dc;--warnink:#6b4a0a;--warnline:#e6c26a;
--chkbg:#eef0f3;--chkink:#454c56;--chkline:#c9ced6;
--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root{
--bg:#111317;--surface:#1b1e24;--ink:#e8eaee;--mut:#9aa1ab;--line:#2c3038;
--ac:#7aa2ff;--on-ac:#0d1222;--acsoft:#1f2a44;
--good:#5fd08f;--goodbg:#173022;--bad:#ff8a7a;--badbg:#3a1e1b;
--warnbg:#33290f;--warnink:#f2d89b;--warnline:#7a6224;
--chkbg:#23262d;--chkink:#c3c8d0;--chkline:#3b4049;
--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
svg{flex:none}
.view{flex:1;display:flex;flex-direction:column}

/* Top bar */
.top{width:100%;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;
padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.top h1{flex:1;min-width:0;margin:0;font-size:16px;font-weight:650;line-height:1.25}
.top h1>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top h1{font-size:24px;font-weight:700;padding:6px 0 2px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;border-radius:50%;color:var(--ink);text-decoration:none;flex:none}
@media(hover:hover){.iconbtn:hover{background:var(--line)}}
.fbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:0;max-width:58%;flex:0 1 auto;padding:0 8px 0 12px;border:1px solid var(--line);background:var(--surface);border-radius:22px;cursor:pointer;font-size:15px}
.fbtn #fsum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn #fcount{background:var(--acsoft);color:var(--ac);border-radius:12px;padding:1px 9px;font-size:13px;font-variant-numeric:tabular-nums}

/* Home */
main{flex:1;width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
main.home{display:block;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.course{margin:6px 0 22px}
.course h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:8px 2px}
.course h2 span{text-transform:none;letter-spacing:0;font-weight:500}
.exam{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 14px 16px;margin-bottom:8px;color:inherit;text-decoration:none;box-shadow:var(--shadow)}
.exam-t{flex:1;min-width:0}
.exam-n{display:block;font-weight:650;font-size:18px}
.exam-m{display:block;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.exam .sbar{margin:8px 0 2px;height:4px}
.exam>svg{color:var(--mut)}
@media(hover:hover){.exam:hover{border-color:var(--ac)}}
.home-empty{color:var(--mut);text-align:center;margin-top:40px}

/* Study */
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mut);font-size:15px;min-height:44px;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:transparent;border-radius:18px;cursor:pointer;font-size:14px;color:var(--mut)}
.toggle[aria-pressed="true"]{background:var(--acsoft);border-color:var(--ac);color:var(--ac)}
.prog{height:4px;background:var(--line);border-radius:2px;margin:2px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}

.card{flex:1;min-height:300px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.card.flipped{box-shadow:inset 0 4px 0 var(--ac),var(--shadow)}
.card.isempty{cursor:default;justify-content:center}
.card.in{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card.in{animation:none}.prog i{transition:none}}
.tag{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);margin-bottom:14px}
.badge{flex:none;font-weight:600;font-size:12px;border-radius:10px;padding:2px 9px}
.badge.s-g{background:var(--goodbg);color:var(--good)}
.badge.s-m{background:var(--badbg);color:var(--bad)}
.q{font-size:21px;line-height:1.45;font-weight:600;margin:0}
.q-small{font-size:15px;color:var(--mut);margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ac);margin:0 0 2px}
.a{font-size:19px;line-height:1.45;font-weight:600;margin:0 0 16px}
.why{margin:0 0 16px}
.note{border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:16px;border-left:4px solid}
.note .lbl{color:inherit}
.note.mis{background:var(--warnbg);color:var(--warnink);border-color:var(--warnline)}
.note.chk{background:var(--chkbg);color:var(--chkink);border-color:var(--chkline)}
.empty{text-align:center;max-width:420px;margin:0 auto}
.empty-t{font-size:19px;font-weight:650;margin:0 0 6px}
.empty p{margin:0 0 6px;color:var(--mut)}
.empty .empty-t{color:var(--ink)}
.empty .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.keys{text-align:center;color:var(--mut);font-size:13px;margin:10px 0 0}

.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ac);color:var(--on-ac);border-color:transparent}
.btn.miss{background:var(--badbg);color:var(--bad);border-color:transparent}
.btn.got{background:var(--goodbg);color:var(--good);border-color:transparent}
.btn.miss[aria-pressed="true"],.btn.got[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
@media(hover:hover){.btn:not(:disabled):hover,.toggle:hover,.fbtn:hover{filter:brightness(.96)}}
kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.7}

.actions{position:sticky;bottom:0;background:var(--bg);margin-top:auto;
padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.actions-in{max-width:688px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav{width:52px;height:52px;border-radius:50%;padding:0;flex:none}
.mid{flex:1;display:flex;gap:10px;min-width:0}
.mid .btn{flex:1;min-height:52px;font-size:17px;padding:0 10px;white-space:nowrap;min-width:0}
#markrow{flex:1;display:flex;gap:10px}

/* Filter sheet */
dialog.sheet{border:0;padding:0;margin:0;color:var(--ink);background:var(--bg);width:100%;max-width:none;max-height:88vh;max-height:88dvh;
position:fixed;inset:auto 0 0 0;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
.panel{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:18px;margin:0}
.sheet-b{overflow:auto;padding:4px 16px 16px;overscroll-behavior:contain}
.sheet-f{padding:12px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .btn{width:100%}
@media(min-width:720px){
dialog.sheet{inset:0;margin:auto;max-width:560px;max-height:min(84vh,760px);border-radius:16px}
.panel{max-height:min(84vh,760px)}}
body:has(dialog[open]){overflow:hidden}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec h3{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0}
.link{border:0;background:transparent;color:var(--ac);font-weight:600;font-size:15px;min-height:40px;padding:0 6px;cursor:pointer}
.chgrp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:8px}
.chgrp.on{border-color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;min-height:46px;cursor:pointer}
.row input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ac);cursor:pointer}
.row.chl .row-t{font-weight:600}
.row.lec{padding-left:32px;font-size:15px;color:var(--mut);border-top:1px solid var(--line)}
.cnt{margin-left:auto;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
@media(max-width:440px){.seg{grid-template-columns:repeat(2,1fr)}}
.seg-b{min-height:52px;border:0;border-radius:9px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;font-size:14px;color:var(--mut)}
.seg-b b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.seg-b[aria-pressed="true"]{background:var(--acsoft);color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
.seg-b[aria-pressed="true"] b{color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;font-size:14px;color:var(--mut)}
.stat b{font-size:22px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.s-g b{color:var(--good)}.stat.s-m b{color:var(--bad)}
.sbar{display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 14px}
.sbar .s-g{background:var(--good)}.sbar .s-m{background:var(--bad)}
.btn.clear{width:100%;background:transparent;color:var(--bad)}
.btn.clear.armed{background:var(--bad);color:var(--surface);border-color:transparent}
.fine{font-size:13px;color:var(--mut);margin:6px 0 0;text-align:center}

@media(hover:none){.keys,kbd{display:none}}
@media(max-width:360px){.mid .btn{font-size:16px;padding:0 6px}}
</style>
<script>
/* Data files call these. Defined before data/courses.js loads. */
window.FC={list:[],reg:{},courses(l){FC.list=l},register(key,data){FC.reg[key]=data}};
</script>
<script src="data/courses.js"></script>
</head><body>

<!-- ============ Home: courses and exams ============ -->
<div class="view" id="homev" hidden>
<header class="top home-top"><h1>Flashcards</h1></header>
<main class="home" id="courses"></main>
</div>

<!-- ============ Study one exam ============ -->
<div class="view" id="studyv" hidden>
<header class="top">
<a class="iconbtn" id="home" href="#" aria-label="All courses"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
<h1><small id="tcourse"></small><span id="texam"></span></h1>
<button class="fbtn" id="fbtn" type="button" aria-haspopup="dialog" aria-label="Choose cards">
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
<span id="fsum"></span><b id="fcount"></b>
</button>
</header>

<main>
<div class="meta">
<span id="n" aria-live="polite"></span>
<button class="toggle" id="shuf" type="button" aria-pressed="false">
<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg>
Shuffle</button>
</div>
<div class="prog"><i id="p"></i></div>
<div class="card" id="c" aria-live="polite"></div>
<p class="keys"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> missed · <kbd>2</kbd> got it</p>
</main>

<nav class="actions" aria-label="Card controls"><div class="actions-in">
<button class="btn nav" id="prev" type="button" aria-label="Previous card"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<div class="mid">
<button class="btn primary" id="flip" type="button">Show answer <kbd>Space</kbd></button>
<div id="markrow" hidden>
<button class="btn miss" id="mmiss" type="button" aria-pressed="false">✗ Missed it <kbd>1</kbd></button>
<button class="btn got" id="mgot" type="button" aria-pressed="false">✓ Got it <kbd>2</kbd></button>
</div>
</div>
<button class="btn nav" id="next" type="button" aria-label="Next card"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div></nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-t"><div class="panel">
<div class="sheet-h"><h2 id="sheet-t">Choose cards</h2><button class="link" id="x" type="button">Close</button></div>
<div class="sheet-b">
<section class="sec">
<div class="sec-h"><h3 id="unit-h">Chapters</h3><span><button class="link" id="fall" type="button">Select all</button><button class="link" id="fnone" type="button">Clear all</button></span></div>
<div id="filters"></div>
</section>
<section class="sec">
<div class="sec-h"><h3>Show</h3></div>
<div class="seg" id="sfilt" role="group" aria-label="Show cards"></div>
</section>
<section class="sec">
<div class="sec-h"><h3 id="prog-h">Progress in selected chapters</h3></div>
<div class="stats" id="stats"></div>
<div class="sbar" id="sbar" aria-hidden="true"></div>
<button class="btn clear" id="clr" type="button">Clear marks</button>
<p class="fine" id="clr-note">Only clears marks in the selected chapters.</p>
</section>
</div>
<div class="sheet-f"><button class="btn primary" id="done" type="button" autofocus>Done</button></div>
</div></dialog>
</div>

<script>
/* The app. Card data lives in data/*.js; see HOW-TO-ADD.md. */
const $=id=>document.getElementById(id);
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function unstore(k){try{localStorage.removeItem(k)}catch(e){}}
function el(t,cls,txt){const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const LAST="fc_last";

/* ---------- Exam registry and loading ---------- */
const EX={};
FC.list.forEach(co=>(co.exams||[]).forEach(ex=>{
const key=co.id+"/"+ex.id;
EX[key]=Object.assign({},ex,{key,course:co,store:ex.storageKey||("fc_"+co.id+"_"+ex.id)})}));
const loading={};
function loadExam(key){
if(FC.reg[key])return Promise.resolve(FC.reg[key]);
if(loading[key])return loading[key];
const ex=EX[key];
return loading[key]=new Promise((res,rej)=>{
const s=document.createElement("script");s.src=ex.file;
s.onload=()=>FC.reg[key]?res(FC.reg[key]):rej(new Error(ex.file+' loaded, but it doesn\'t register "'+key+'".'));
s.onerror=()=>rej(new Error("Couldn't load "+ex.file+"."));
document.head.append(s)}).catch(e=>{delete loading[key];throw e});
}
const marksOf=ex=>{try{const m=JSON.parse(load(ex.store+"_marks"));return m&&typeof m==="object"&&!Array.isArray(m)?m:{}}catch(e){return {}}};
const chev='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- Home ---------- */
function drawHome(){
const box=$("courses");box.replaceChildren();
if(!FC.list.length){box.append(el("p","home-empty","No courses yet. Add one in data/courses.js."));return}
FC.list.forEach(co=>{
const sec=el("section","course"),h=el("h2","",co.code||co.id);
if(co.name)h.append(el("span",""," · "+co.name));
sec.append(h);
(co.exams||[]).forEach(e=>{
const ex=EX[co.id+"/"+e.id],a=el("a","exam");a.href="#"+ex.key;
const t=el("span","exam-t"),meta=el("span","exam-m","Loading…"),bar=el("span","sbar");
t.append(el("span","exam-n",ex.name),meta,bar);a.append(t);a.insertAdjacentHTML("beforeend",chev);sec.append(a);
loadExam(ex.key).then(data=>{
const ids=new Set((data.D||[]).map(cid)),m=marksOf(ex);let g=0,ms=0;
for(const k in m)if(ids.has(k)){if(m[k]==="g")g++;else if(m[k]==="m")ms++}
const n=ids.size;meta.textContent=n+" cards"+(g+ms?" · "+g+" got it · "+ms+" missed":"");
[["g",g],["m",ms]].forEach(([k,v])=>{const x=el("i","s-"+k);x.style.width=(n?v/n*100:0)+"%";bar.append(x)});
}).catch(err=>{meta.textContent=err.message;bar.remove()});
});
box.append(sec)});
}

/* ---------- Study state (reset for each exam) ---------- */
let cur=null,CH={},D=[],LBL={},UNIT="Ch",KEY="",MKEY="",SKEY="";
let groups={},chs=[],all=[],sel=new Set(),mk={},show="all";
const gid=(ch,l)=>ch+"-"+l;
const lecLabel=(ch,l)=>LBL[ch+"-"+l]||"Lecture "+l;
const lecsOf=ch=>[...groups[ch]].sort((a,b)=>a-b);
/* Marks: 'g' = got it, 'm' = missed. Keyed by chapter-lecture-question so they survive adding cards. */
const cid=d=>d.ch+"-"+d.lec+"-"+d.n;
const saveSel=()=>store(KEY,JSON.stringify([...sel]));
const saveMk=()=>store(MKEY,JSON.stringify(mk));
const inSel=d=>sel.has(gid(d.ch,d.lec));
const stOk=d=>show==="all"||(show==="u"?!mk[cid(d)]:mk[cid(d)]===show);
const cards=()=>D.map((d,k)=>k).filter(k=>inSel(D[k])&&stOk(D[k]));
const SHOWN={all:"All",m:"Missed",u:"Not marked",g:"Got it"};

const c=$("c"),dlg=$("sheet"),clr=$("clr");
let shuffled=false,ord=[],i=0,f=false,atEnd=false,armed=null,openTok=0;

function useExam(ex,data){
cur=ex;CH=data.CH||{};D=data.D||[];LBL=data.LBL||{};UNIT=data.unit||"Ch";
KEY=ex.store;MKEY=KEY+"_marks";SKEY=KEY+"_show";
groups={};D.forEach(d=>{(groups[d.ch]=groups[d.ch]||new Set()).add(d.lec)});
chs=Object.keys(groups).sort((a,b)=>a-b);
all=[];chs.forEach(ch=>lecsOf(ch).forEach(l=>all.push(gid(ch,l))));
sel=new Set();
try{const s=JSON.parse(load(KEY));if(Array.isArray(s))sel=new Set(s.filter(k=>all.includes(k)))}catch(e){}
if(!sel.size)all.forEach(k=>sel.add(k));
mk=marksOf(ex);
show=load(SKEY);if(!["all","m","u","g"].includes(show))show="all";
shuffled=false;$("shuf").setAttribute("aria-pressed","false");
const word=UNIT==="Ch"?"chapters":UNIT.toLowerCase()+"s";
$("unit-h").textContent=word[0].toUpperCase()+word.slice(1);
$("prog-h").textContent="Progress in selected "+word;
$("clr-note").textContent="Only clears marks in the selected "+word+".";
}

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
/* The list is only rebuilt when a filter changes, never when a card is marked. */
function build(){ord=cards();if(shuffled)shuffle(ord);i=0;f=false;atEnd=false}
function apply(){saveSel();build();drawFilters();render()}

function selSummary(){
if(!sel.size)return "Nothing selected";
if(sel.size===all.length)return "All "+(UNIT==="Ch"?"chapters":UNIT.toLowerCase()+"s");
const parts=[];
chs.forEach(ch=>{const ls=lecsOf(ch),on=ls.filter(l=>sel.has(gid(ch,l)));if(!on.length)return;
parts.push(on.length===ls.length?UNIT+" "+ch:UNIT+" "+ch+" ("+on.map(l=>"L"+l).join(", ")+")")});
return parts.join(", ");
}

function drawFilters(){
const ae=document.activeElement,fk=ae&&ae.dataset?ae.dataset.k:null;
const box=$("filters");box.replaceChildren();
const row=(cls,k,txt,n,checked,mixed,fn)=>{const l=el("label","row "+cls),x=el("input");x.type="checkbox";x.checked=checked;x.indeterminate=mixed;x.dataset.k=k;x.onchange=fn;l.append(x,el("span","row-t",txt),el("span","cnt",n));return l};
chs.forEach(ch=>{
const lecs=lecsOf(ch),ks=lecs.map(l=>gid(ch,l)),on=ks.filter(k=>sel.has(k)).length;
const g=el("div","chgrp"+(on?" on":""));
g.append(row("chl","ch"+ch,UNIT+" "+ch+(CH[ch]?" · "+CH[ch]:""),D.filter(d=>d.ch==ch).length,on===ks.length,on>0&&on<ks.length,
()=>{ks.forEach(k=>on===ks.length?sel.delete(k):sel.add(k));apply()}));
if(lecs.length>1)lecs.forEach(l=>{const k=gid(ch,l);
g.append(row("lec",k,lecLabel(ch,l),D.filter(d=>d.ch==ch&&d.lec==l).length,sel.has(k),false,()=>{sel.has(k)?sel.delete(k):sel.add(k);apply()}))});
box.append(g)});

const S=D.filter(inSel),g=S.filter(d=>mk[cid(d)]==="g").length,m=S.filter(d=>mk[cid(d)]==="m").length,u=S.length-g-m;
const sf=$("sfilt");sf.replaceChildren();
[["all",S.length],["m",m],["u",u],["g",g]].forEach(([k,n])=>{
const b=el("button","seg-b");b.type="button";b.dataset.k="show-"+k;b.setAttribute("aria-pressed",show===k);
b.append(el("span","",SHOWN[k]),el("b","",n));b.onclick=()=>{show=k;store(SKEY,k);apply()};sf.append(b)});

const st=$("stats");st.replaceChildren();
[["g","Got it",g],["m","Missed",m],["u","Not marked",u]].forEach(([k,t,n])=>{const x=el("div","stat s-"+k);x.append(el("b","",n),el("span","",t));st.append(x)});
const bar=$("sbar");bar.replaceChildren();
[["g",g],["m",m]].forEach(([k,n])=>{const x=el("i","s-"+k);x.style.width=(S.length?n/S.length*100:0)+"%";bar.append(x)});
if(!armed)clr.disabled=!(g+m);

$("fsum").textContent=selSummary()+(show==="all"?"":" · "+SHOWN[show]);
$("fcount").textContent=ord.length;
$("fbtn").setAttribute("aria-label","Choose cards. Now: "+$("fsum").textContent+", "+ord.length+" cards");
$("done").textContent=ord.length?"Study "+ord.length+" card"+(ord.length===1?"":"s"):"Done";
if(fk){const t=document.querySelector('[data-k="'+fk+'"]');if(t&&t!==ae)t.focus()}
}

function note(cls,lbl,txt){const b=el("div","note "+cls);b.append(el("p","lbl",lbl),document.createTextNode(txt));return b}
function btn(txt,cls,fn){const b=el("button",cls,txt);b.type="button";b.onclick=e=>{e.stopPropagation();fn()};return b}

function render(){
const ae=document.activeElement,has=ord.length>0;
$("n").textContent=has?"Card "+(i+1)+" of "+ord.length+(atEnd?" · end of list":""):"No cards";
$("p").style.width=has?((i+1)/ord.length*100)+"%":"0";
$("prev").disabled=$("next").disabled=ord.length<2;
$("flip").disabled=!has;
$("flip").hidden=has&&f;$("markrow").hidden=!(has&&f);
c.replaceChildren();
c.classList.toggle("flipped",has&&f);c.classList.toggle("isempty",!has);
c.classList.remove("in");void c.offsetWidth;c.classList.add("in");
if(!has){
const e=el("div","empty"),b=el("div","btns");
const word=UNIT==="Ch"?"chapter":UNIT.toLowerCase();
if(!D.length){
e.append(el("p","empty-t","No cards yet"),el("p","","This exam's data file has no cards."));
}else if(!sel.size){
e.append(el("p","empty-t","Nothing selected"),el("p","","Choose at least one "+word+" or lecture to study."));
b.append(btn("Choose "+word+"s","btn primary",openSheet));
}else{
const msg={m:["No missed cards","You haven't marked any card in the selection as missed."],
u:["No unmarked cards","Every card in the selection is already marked."],
g:["No “Got it” cards","You haven't marked any card in the selection as got it."]}[show];
e.append(el("p","empty-t",msg[0]),el("p","",msg[1]+" Show all cards, or pick other "+word+"s."));
b.append(btn("Show all cards","btn primary",()=>{show="all";store(SKEY,"all");apply()}),btn("Choose "+word+"s","btn",openSheet));
}
e.append(b);c.append(e);
}else{
const d=D[ord[i]],s=mk[cid(d)];
$("mmiss").setAttribute("aria-pressed",s==="m");$("mgot").setAttribute("aria-pressed",s==="g");
const tag=el("div","tag");
/* Skip "Lecture 1" when the chapter has only one lecture and no custom label. */
const lecPart=groups[d.ch].size>1||LBL[d.ch+"-"+d.lec]?" · "+lecLabel(d.ch,d.lec):"";
tag.append(el("span","",UNIT+" "+d.ch+(CH[d.ch]?" "+CH[d.ch]:"")+lecPart+" · Q"+d.n));
if(s)tag.append(el("span","badge s-"+s,s==="g"?"✓ Got it":"✗ Missed"));
c.append(tag);
if(!f)c.append(el("p","q",d.q));
else{
c.append(el("p","q-small",d.q),el("p","lbl","Answer"),el("p","a",d.a),el("p","lbl","Why"),el("p","why",d.why));
if(d.mis)c.append(note("mis","Common mistake",d.mis));
if(d.chk)c.append(note("chk","Check your slides",d.chk));
}
}
/* If the focused control was just hidden (Show answer ↔ mark buttons), move focus to its replacement. */
if(ae&&ae.closest&&ae.closest(".actions")&&ae.closest("[hidden]"))(f?$("mmiss"):$("flip")).focus({preventScroll:true});
}

function flip(){if(!cur||!ord.length)return;f=!f;render()}
function go(k){if(!cur||!ord.length)return;i=(i+k+ord.length)%ord.length;f=false;atEnd=false;render();window.scrollTo({top:0})}
/* Marking saves and moves on. On the last card it stays put instead of wrapping. */
function mark(v){if(!cur||!f||!ord.length)return;mk[cid(D[ord[i]])]=v;saveMk();drawFilters();
if(i<ord.length-1)go(1);else{f=false;atEnd=true;render()}}

function openSheet(){if(!cur)return;disarm();drawFilters();if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");dlg.querySelector(".sheet-b").scrollTop=0}
function closeSheet(){disarm();if(dlg.open){if(dlg.close)dlg.close();else dlg.removeAttribute("open")}}
function disarm(){if(armed)clearTimeout(armed);armed=null;clr.classList.remove("armed");clr.textContent="Clear marks"}

/* ---------- Views and routing: "#course/exam" opens an exam, no hash shows home ---------- */
function showHome(){
openTok++;cur=null;closeSheet();unstore(LAST);
$("studyv").hidden=true;$("homev").hidden=false;document.title="Flashcards";drawHome();window.scrollTo({top:0});
}
async function openExam(key){
const ex=EX[key],tok=++openTok;
closeSheet();$("homev").hidden=true;$("studyv").hidden=false;window.scrollTo({top:0});
$("tcourse").textContent=ex.course.code||ex.course.id;$("texam").textContent=ex.name;
document.title=ex.name+" · "+(ex.course.code||ex.course.id)+" Flashcards";
store(LAST,key);
if(!cur||cur.key!==key){
cur=null;ord=[];$("fsum").textContent="";$("fcount").textContent="";$("n").textContent="";$("p").style.width="0";
$("flip").hidden=false;$("markrow").hidden=true;$("flip").disabled=$("prev").disabled=$("next").disabled=true;
c.className="card isempty";c.replaceChildren(el("p","empty empty-t","Loading…"));
let data;
try{data=await loadExam(key)}catch(err){
if(tok!==openTok)return;
const e=el("div","empty");e.append(el("p","empty-t","Couldn't open this exam"),el("p","",err.message));
const b=el("div","btns"),a=el("a","btn primary","All courses");a.href="#";b.append(a);e.append(b);c.replaceChildren(e);return}
if(tok!==openTok)return;
useExam(ex,data);build();
}
drawFilters();render();
}
function route(){
const key=decodeURIComponent(location.hash.slice(1));
if(key&&EX[key])openExam(key);
else{if(location.hash)history.replaceState(null,"",location.pathname+location.search);showHome()}
}

$("flip").onclick=flip;
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("mmiss").onclick=()=>mark("m");
$("mgot").onclick=()=>mark("g");
$("shuf").onclick=()=>{if(!cur)return;shuffled=!shuffled;$("shuf").setAttribute("aria-pressed",shuffled);build();drawFilters();render()};
$("fbtn").onclick=openSheet;
$("done").onclick=closeSheet;
$("x").onclick=closeSheet;
dlg.addEventListener("click",e=>{if(e.target===dlg)closeSheet()});
dlg.addEventListener("close",disarm);
$("fall").onclick=()=>{all.forEach(k=>sel.add(k));apply()};
$("fnone").onclick=()=>{sel.clear();apply()};
/* Two-click confirm (no confirm() dialogs). Only clears the current selection. */
clr.onclick=()=>{
if(armed){disarm();for(const d of D)if(inSel(d))delete mk[cid(d)];saveMk();apply()}
else{const n=D.filter(d=>inSel(d)&&mk[cid(d)]).length;
clr.textContent="Tap again to clear "+n+" mark"+(n===1?"":"s");clr.classList.add("armed");armed=setTimeout(disarm,3000)}};

/* Card: tap/click flips, horizontal swipe moves (a swipe never flips). */
let sx=null,sy=0,swiped=false;
c.addEventListener("pointerdown",e=>{if(e.button)return;sx=e.clientX;sy=e.clientY;swiped=false});
c.addEventListener("pointerup",e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
if(Math.abs(dx)>50&&Math.abs(dx)>1.5*Math.abs(dy)){swiped=true;go(dx<0?1:-1)}});
c.addEventListener("pointercancel",()=>{sx=null});
c.addEventListener("click",e=>{
if(swiped){swiped=false;return}
if(e.target.closest("button,a"))return;
if(window.getSelection&&String(getSelection()).length)return; /* selecting text shouldn't flip */
flip()});

/* Keyboard: study screen only; ignored while the filter sheet is open, in form controls, or with ⌘/⌃/⌥ held. */
document.addEventListener("keydown",e=>{
if(!cur||$("studyv").hidden||dlg.open||e.metaKey||e.ctrlKey||e.altKey)return;
const t=e.target;if(t.closest&&t.closest("dialog,input,select,textarea"))return;
if(e.key==="ArrowRight"){e.preventDefault();go(1)}
else if(e.key==="ArrowLeft"){e.preventDefault();go(-1)}
else if(e.key==="1")mark("m");
else if(e.key==="2")mark("g");
else if(e.key===" "){
/* Let Space press other focused buttons and links; in the action bar or elsewhere it flips. */
if(t.closest&&t.closest("button,a")&&!t.closest(".actions"))return;
e.preventDefault();flip()}
});

/* Start: a link to an exam wins; otherwise reopen the last exam, else show home. */
window.addEventListener("hashchange",route);
if(!location.hash){const last=load(LAST);if(last&&EX[last])history.replaceState(null,"","#"+last)}
route();
</script></body></html>
